[package]
name = "openportfolio"
version = "0.1.0"
description = "OpenPortfolio desktop shell"
authors = ["OpenPortfolio Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openportfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openportfolio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
