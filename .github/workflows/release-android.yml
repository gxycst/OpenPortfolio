name: Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-android.*"

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android target
        run: npm run tauri:android:init

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p output
          set -o pipefail
          npm run tauri:android:build -- --verbose 2>&1 | tee output/android-build.log

      - name: Package Android APK
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK_PATH" output/OpenPortfolio-android-arm64-debug.apk

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: output/android-build.log

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenPortfolio-android-arm64-debug
          path: output/OpenPortfolio-android-arm64-debug.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/OpenPortfolio-android-arm64-debug.apk
