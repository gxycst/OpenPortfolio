name: Release Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri executable
        run: npm run tauri:build

      - name: Package portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item src-tauri\target\release\openportfolio.exe output\OpenPortfolio.exe
          Compress-Archive -Path output\OpenPortfolio.exe -DestinationPath output\OpenPortfolio-windows-x64-portable.zip -Force

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            output/OpenPortfolio.exe
            output/OpenPortfolio-windows-x64-portable.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android target
        run: npm run tauri:android:init

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p output
          set -o pipefail
          npm run tauri:android:build -- --verbose 2>&1 | tee output/android-build.log

      - name: Package Android APK
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          keytool -genkeypair \
            -keystore output/openportfolio-sideload.jks \
            -storepass openportfolio \
            -keypass openportfolio \
            -alias openportfolio-sideload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OpenPortfolio,O=OpenPortfolio,C=US"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK_PATH" output/OpenPortfolio-android-arm64-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks output/openportfolio-sideload.jks \
            --ks-key-alias openportfolio-sideload \
            --ks-pass pass:openportfolio \
            --key-pass pass:openportfolio \
            --out output/OpenPortfolio-android-arm64-release.apk \
            output/OpenPortfolio-android-arm64-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/OpenPortfolio-android-arm64-release.apk

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: output/OpenPortfolio-android-arm64-release.apk

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: output/android-build.log

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-assets"
          merge-multiple: true

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            OpenPortfolio local-first app release.

            Assets:
            - OpenPortfolio.exe: Windows portable executable
            - OpenPortfolio-windows-x64-portable.zip: Windows portable zip
            - OpenPortfolio-android-arm64-release.apk: Android arm64 APK for sideload testing
          files: release-assets/*
